<h2> CONTADOR DE CARACTERES </h2>
<body>
        <div id="resultado"></div>
        <script>
                function contarCaracteres(cadena){
                    return cadena.length;
                }
                const mensajeInicial = "Mathias Sebastian Lombardi Recalde";
                const resultadoInicial = 'la cantidad de caracteres de la cadena inicial es de:  ${contarCaracteres(mensajeInicial)}';
                console.log(resultadoInicial);

                document.getElementById("resultado").innerText = resultadoInicial;
        </script>
        <script src = "EjercicioUno.js"></script>
</body>
