<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora</title>
    <link rel="stylesheet" href="Calculadora.css">
</head>
<body>
    <div class="calculadora">
        <label for="pantalla" class="oculto">)</label>
        <input type="text" id="pantalla" class="pantalla" readonly>
        <table>
            <tr>
                <td onclick="seguirAgregando(`7`)">7</td>
                <td onclick="seguirAgregando(`8`)">8</td>
                <td onclick="seguirAgregando(`9`)">9</td>
                <td onclick="borrarUltimo()">DEL</td>
                <td onclick="limpiarPantalla()" class="borrar">C</td>
            </tr>
            <tr>
                <td onclick="seguirAgregando(`4`)">4</td>
                <td onclick="seguirAgregando(`5`)">5</td>
                <td onclick="seguirAgregando(`6`)">6</td>(
                <td class="operador" onclick="operar(`×`)">×</td>
                <td class="operador" onclick="operar(`÷`)">÷</td>
            </tr>
            <tr>
                <td onclick="seguirAgregando(`1`)">1</td>
                <td onclick="seguirAgregando(`2`)">2</td>
                <td onclick="seguirAgregando(`3`)">3</td>
                <td class="operador" onclick="operar(`+`)">+</td>
                <td class="operador" onclick="operar(`-`)">-</td>
            </tr>
            <tr>
                <td></td>
                <td onclick="seguirAgregando(`.`)">.</td>
                <td onclick="seguirAgregando('0')">0</td>
                <td onclick="seguirAgregando(`00`)">00</td>
                <td onclick="calcular()">=</td>
            </tr>
        </table>
    </div>
    <script src="Calculadora.js"></script>

</body>
</html>
