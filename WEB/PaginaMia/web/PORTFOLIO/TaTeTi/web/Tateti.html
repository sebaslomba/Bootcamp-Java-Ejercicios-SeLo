<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TA-TE-TI</title>
    <link rel="stylesheet" href="Tateti.css">
</head>
<body>
<div id="mensajeError" style="display: none; color: red;">Por favor, ingresa los nombres de los jugadores.</div>

<div id="configuracion" class="configuracion">
    <div class="texto">
        <h2>CONFIGURACION DEL JUEGO</h2>
        <label for="jugadorX">Nombre del Jugador X:</label>
        <input type="text" id="jugadorX" placeholder="Jugador X"><br><br>

        <label for="jugadorO">Nombre del Jugador O:</label>
        <input type="text" id="jugadorO" placeholder="Jugador O"><br><br>

        <button id="iniciarJuego">Iniciar Juego</button>
    </div>
</div>

<div id="tablero" class="juego oculto">
    <h3 id="turno">Es el turno de X</h3>
    <div class="tablero-caja">
    <table>
        <tr>
            <td data-index="0"></td>
            <td data-index="1"></td>
            <td data-index="2"></td>
        </tr>
        <tr>
            <td data-index="3"></td>
            <td data-index="4"></td>
            <td data-index="5"></td>
        </tr>
        <tr>
            <td data-index="6"></td>
            <td data-index="7"></td>
            <td data-index="8"></td>
        </tr>
    </table>
        <canvas id="lineaVictoria" width="300" height="300" class="linea-victoria"></canvas>

</div>
    <div id="estetico" class="decorativo">
        <p>Juego en proceso</p>
    </div>
    <button id="reiniciarTablero">Reiniciar Juego</button>
</div>

<script src="Tateti.js" defer></script>
</body>
</html>
