<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Contactame</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="Contactame.css">
</head>
<body>
<div id="containerFormulario" class="containerFormulario collapsed">
  <h2>Envia a Sebas tu consulta!</h2>
  <form id="formadeContacto">
    <div class="campos">
      <label for="nombre">Nombre</label>
      <input type="text" id="nombre" name="nombre" required>
    </div>
    <div class="campos">
      <label for="correo">Correo</label>
      <input type="text" id="correo" name="correo" required>
    </div>
    <div class="formadeContacto motivoGroup">
      <label for="motivo" style="display: none">Motivo de consulta</label>
      <textarea id="motivo" name="motivo" class="motivo"></textarea>
    </div>
    <button type="submit" id="nextButton">Enviar
      <img src="imagenes/enviar.svg" alt="Enviar">
    </button>
  </form>
</div>
<div class="botonHome">
  <a href="HomeWEB.html">
    <img src="imagenes/pagina-de-inicio.svg" alt="Pagina de Inicio">
  </a>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
<script src="Contactame.js"></script>

</body>
</html>
